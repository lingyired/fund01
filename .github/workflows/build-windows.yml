name: Build Windows installers

# Windows 安装包无法从 macOS 构建：链接需要 MSVC 的 link.exe + Windows SDK 导入库
# （kernel32.lib / user32.lib 等，微软专有文件），打包还需要 makensis(NSIS)。
# 本机 rustup 虽然装了 x86_64-pc-windows-msvc 的 std，但缺链接器与 SDK，交叉不可行。
# 因此用 windows-latest runner 原生跑 scripts/build-release-windows.mjs。
#
# 产出：x64 与 arm64 两个 NSIS 安装包，**只上传 artifact，不建 GitHub Release**。
# 触发：手动 workflow_dispatch（可选架构），或 push tag v*。
# 想要 Release：下载 artifact 校验通过后手动建，或另接 softprops/action-gh-release。

on:
  workflow_dispatch:
    inputs:
      arch:
        description: '目标架构（默认两个都打）'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - x64
          - arm64
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: windows-latest
    # arm64 依赖 VS 的 ARM64 交叉工具（x64_arm64），runner 镜像可能未带该组件；
    # 失败不阻塞 x64 —— 单架构可用也比全红好，日志里会明确标出。
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        # 手动触发且指定了单架构时只跑那一个，否则两个都跑。
        # 注意：过滤只能写在 matrix 定义处 —— job 级 `if` 不能引用 matrix 上下文
        # （GitHub 会报 Unrecognized named-value: 'matrix'）。
        arch: ${{ fromJSON((github.event_name == 'workflow_dispatch' && github.event.inputs.arch != 'all' && github.event.inputs.arch != '') && format('["{0}"]', github.event.inputs.arch) || '["x64", "arm64"]') }}
        # include 里与 arch 同名的条目会自动补上其余属性（target / label / experimental）
        include:
          - arch: x64
            label: x64 (Intel/AMD)
            target: x86_64-pc-windows-msvc
            experimental: false
          - arch: arm64
            label: Windows on ARM
            target: aarch64-pc-windows-msvc
            experimental: true

    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # 版本读根 package.json 的 packageManager 字段（pnpm@9.15.0）

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # host(x86_64-pc-windows-msvc) 由 action 默认安装；arm64 用 vcvarsall 的
          # x64_arm64 交叉，只需额外补装 target 的 std。
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/tauri/src-tauri
          # 两个 matrix 架构的 target 目录分开缓存，避免互相覆盖
          key: ${{ matrix.arch }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # GitHub 的 windows 镜像通常预装 NSIS，但版本/路径会随镜像漂移；
      # 找不到 makensis 才装，装在默认路径下 tauri 能自动定位。
      - name: Ensure NSIS is available
        shell: pwsh
        run: |
          if (Get-Command makensis -ErrorAction SilentlyContinue) {
            Write-Host "makensis: $((Get-Command makensis).Source)"
          } else {
            Write-Host "未找到 makensis，安装 NSIS..."
            choco install nsis -y --no-progress
          }

      - name: Build ${{ matrix.label }} installer
        id: build
        run: node scripts/build-release-windows.mjs --arch ${{ matrix.arch }}

      - name: Upload installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fund01-windows-${{ matrix.arch }}
          path: release-windows/*.exe
          if-no-files-found: warn
          retention-days: 30

      - name: Upload checksums
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fund01-windows-${{ matrix.arch }}-sha256
          path: release-windows/SHA256SUMS.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          $status = if ('${{ steps.build.outcome }}' -eq 'success') { '✅ 成功' } else { '❌ 失败（查看上方日志）' }
          Add-Content $env:GITHUB_STEP_SUMMARY "${{ matrix.label }}: $status"
