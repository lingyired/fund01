name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guard-shim:
    name: tw-shim 白名单守卫
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # setup-node@v5 检测到 pnpm-lock.yaml 后默认启用 package-manager-cache，
      # 需要 pnpm 已在 PATH（否则报 Unable to locate executable file: pnpm）。
      # pnpm/action-setup@v4 不指定 version 时自动读根 package.json 的 packageManager 字段。
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # guard job 从不 pnpm install，pnpm store 不存在；若开 package-manager-cache
          # （v5 默认 true），post 步骤保存缓存会 Path Validation 失败把 job 标红。
          package-manager-cache: false
      # guard-shim.mjs 是纯 Node 脚本，无需安装依赖，直接在仓库根目录运行。
      # 任何「源码用到、但 tw-shim.css 白名单缺失」的原子类都会让此步失败（exit 1），
      # 把手写垫片「静默失败」的隐患变成 CI 红。
      - name: Run tw-shim guard
        run: node packages/ui/scripts/guard-shim.mjs
