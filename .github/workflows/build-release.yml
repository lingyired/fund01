name: Build release installers

# 三端发布构建（macOS + Windows + Chrome）。
# 背景：Windows 无法从 macOS 交叉构建（链接需 MSVC link.exe + Windows SDK 导入库，
# 打包需 makensis），因此三端都走 GitHub runner：
#   - macOS  job → macos-15 (arm64) 上跑 scripts/build-release-all.mjs
#     （build-tauri-all 双架构：arm64 原生 + x86_64 交叉 → build-dmg 打 DMG），
#     签名用仓库 secret MACOS_CERT_P12（Fund01 证书 p12）+ MACOS_CERT_PASSWORD 导入临时钥匙串。
#   - Windows job → windows-latest 上跑 scripts/build-release-windows.mjs（MSVC + NSIS）。
#   - Chrome job → ubuntu-latest 上跑 pnpm --filter @fund01/chrome build + zip。
# 命名约定（2026-08-31 定）：**所有 CI 产物统一带 -ci 后缀**：macOS=Fund01_<ver>_<arch>-ci.dmg、
# Windows=Fund01_<ver>_<arch>-ci-setup.exe、Chrome=Fund01_<ver>_chrome-ci.zip，与本机产物区分。
# 产物只上传 artifact（30 天），不建 GitHub Release。
# 触发：手动 workflow_dispatch（可选 platform / arch），或 push tag v*。

on:
  workflow_dispatch:
    inputs:
      platform:
        description: '目标平台（默认全打）'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - macos
          - windows
          - chrome
      arch:
        description: '目标架构（默认都打；macOS: arm64+x86_64，Windows: x64+arm64）'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - x64
          - arm64
  push:
    tags:
      - 'v*'

jobs:
  macos:
    name: macOS build
    runs-on: macos-15
    # 手动触发按 platform 过滤；push tag 无 inputs，总是跑
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.platform == 'all' ||
      github.event.inputs.platform == 'macos'

    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # 版本读根 package.json 的 packageManager 字段（pnpm@9.15.0）

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # arm64（host 原生）+ x86_64（交叉，clang 支持双架构）
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/tauri/src-tauri
          key: macos

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fund01 自签名证书（登录钥匙串导出）导入临时钥匙串：tauri 的 codesign
      # 按名字 "Fund01" 查找签名身份，与本机产物签名一致（Authority=Fund01）。
      #
      # 注意（2026-08-31 首次 CI 验证卡死排查）：codesign 访问私钥时若钥匙串
      # ACL 未放行，无头 runner 会静默挂起——始终停在 "replacing existing
      # signature"，等一个不存在的 GUI 授权弹窗，直到 job 超时。修复要点：
      #   - import 用 -A（允许任意应用访问私钥，临时钥匙串专用，可接受），
      #     不要只 -T /usr/bin/codesign（tauri 内部嵌入调用的 codesign 路径
      #     不在白名单时授权失败即挂起）
      #   - set-key-partition-list 只对新解锁的临时钥匙串生效，且必须
      #     default-keychain 指到它，codesign 才找得到 Fund01
      #   - build 步骤前再 unlock 一次（跨步骤解锁状态不保证持久）
      - name: Install signing certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euxo pipefail
          KEYCHAIN="$RUNNER_TEMP/fund01-build.keychain"
          echo "KEYCHAIN_PATH=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/fund01-cert.p12"
          security create-keychain -p "$MACOS_CERT_PASSWORD" "$KEYCHAIN"
          # 钥匙串自动锁定超时设 6 小时：codesign 中途不会被锁绊住（CI 无 UI 解锁会挂起）
          security set-keychain-settings -t 21600 "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$MACOS_CERT_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/fund01-cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_CERT_PASSWORD" "$KEYCHAIN"
          security find-identity -v -p codesigning

      - name: Build macOS installers + DMG
        # 单架构时透传 --arch（x64 → x86_64，macOS 脚本的命名）；否则双架构全打。
        # APPLE_SIGNING_IDENTITY 默认 Fund01；FUND01_DMG_SUFFIX=-ci 让 DMG 归档名
        # 带来源标识（Fund01_<ver>_<arch>-ci.dmg），与本机产物区分（三端 CI 统一 -ci 约定）。
        env:
          APPLE_SIGNING_IDENTITY: Fund01
          FUND01_DMG_SUFFIX: -ci
        run: |
          set -euxo pipefail
          # 构建前再次解锁临时钥匙串（跨步骤解锁状态不保证持久，卡死元凶之一）
          security unlock-keychain -p "${{ secrets.MACOS_CERT_PASSWORD }}" "$KEYCHAIN_PATH"
          ARCH_FLAG=""
          if [[ "${{ github.event.inputs.arch }}" == "x64" ]]; then
            ARCH_FLAG="--arch x86_64"
          elif [[ "${{ github.event.inputs.arch }}" == "arm64" ]]; then
            ARCH_FLAG="--arch arm64"
          fi
          node scripts/build-release-all.mjs $ARCH_FLAG

      - name: Generate checksums
        working-directory: release-macos
        run: shasum -a 256 Fund01_*.dmg > SHA256SUMS.txt

      - name: Upload DMG
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fund01-macos
          path: |
            release-macos/*.dmg
            release-macos/SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 30

  windows:
    name: Build ${{ matrix.label }}
    runs-on: windows-latest
    # arm64 依赖 VS 的 ARM64 交叉工具（x64_arm64），runner 镜像可能未带该组件；
    # 失败不阻塞 x64 —— 单架构可用也比全红好，日志里会明确标出。
    continue-on-error: ${{ matrix.experimental }}
    # 手动触发按 platform 过滤（与 macos job 同理）；push tag 总是跑
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.platform == 'all' ||
      github.event.inputs.platform == 'windows'
    strategy:
      fail-fast: false
      matrix:
        # 单架构过滤直接作用在 include（唯一组合来源）。
        # 坑（2026-08-31 实测）：不能写成「arch 列表 + 静态 include」两段式 ——
        # GitHub 的 include 语义是「未匹配到现有组合的条目会作为新组合追加」，
        # 单架构时另一个架构会被 include 补回来（-f arch=x64 时 arm64 照样跑）。
        # 手动触发且指定单架构 → 只用对应架构条目；否则（push tag / all）两个都跑。
        include: ${{ fromJSON((github.event_name == 'workflow_dispatch' && github.event.inputs.arch == 'x64') && '[{"arch":"x64","label":"x64 (Intel/AMD)","target":"x86_64-pc-windows-msvc","experimental":false}]' || (github.event_name == 'workflow_dispatch' && github.event.inputs.arch == 'arm64') && '[{"arch":"arm64","label":"Windows on ARM","target":"aarch64-pc-windows-msvc","experimental":true}]' || '[{"arch":"x64","label":"x64 (Intel/AMD)","target":"x86_64-pc-windows-msvc","experimental":false},{"arch":"arm64","label":"Windows on ARM","target":"aarch64-pc-windows-msvc","experimental":true}]') }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # 版本读根 package.json 的 packageManager 字段（pnpm@9.15.0）

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # host(x86_64-pc-windows-msvc) 由 action 默认安装；arm64 用 vcvarsall 的
          # x64_arm64 交叉，只需额外补装 target 的 std。
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/tauri/src-tauri
          # 两个 matrix 架构的 target 目录分开缓存，避免互相覆盖
          key: ${{ matrix.arch }}

      # 缓存 tauri 打包工具目录（%LOCALAPPDATA%\tauri）：内含 NSIS 工具集与
      # WebView2 bootstrapper（MicrosoftEdgeWebview2Setup.exe），tauri 检测到
      # 文件已存在就跳过下载（源码 util.rs: `if !file_path.exists()`）。
      # 首次构建仍需从 GitHub/微软拉一次，之后 7 天内从 Actions cache 恢复，
      # 避免每次打 Windows 包都撞微软/tauri CDN（实测 os error 10054 偶发失败）。
      # 两个架构共享同一份缓存（key 不带 matrix.arch）。
      # actions/cache 的 path 支持 ~ 展开（Windows 上 ~ = %USERPROFILE%，
      # LOCALAPPDATA 即 %USERPROFILE%\AppData\Local）。
      - name: Cache tauri tools (%LOCALAPPDATA%\tauri)
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\tauri
          key: tauri-tools-win

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # GitHub 的 windows 镜像通常预装 NSIS，但版本/路径会随镜像漂移；
      # 找不到 makensis 才装，装在默认路径下 tauri 能自动定位。
      - name: Ensure NSIS is available
        shell: pwsh
        run: |
          if (Get-Command makensis -ErrorAction SilentlyContinue) {
            Write-Host "makensis: $((Get-Command makensis).Source)"
          } else {
            Write-Host "未找到 makensis，安装 NSIS..."
            choco install nsis -y --no-progress
          }

      - name: Build ${{ matrix.label }} installer
        id: build
        # FUND01_EXE_SUFFIX=-ci：归档名带来源标识（Fund01_<ver>_<arch>-ci-setup.exe），
        # 与本机打包（无后缀）区分，避免测试时拿错包。
        env:
          FUND01_EXE_SUFFIX: -ci
        run: node scripts/build-release-windows.mjs --arch ${{ matrix.arch }}

      - name: Upload installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fund01-windows-${{ matrix.arch }}
          path: release-windows/*.exe
          if-no-files-found: warn
          retention-days: 30

      - name: Upload checksums
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fund01-windows-${{ matrix.arch }}-sha256
          path: release-windows/SHA256SUMS.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          $status = if ('${{ steps.build.outcome }}' -eq 'success') { '✅ 成功' } else { '❌ 失败（查看上方日志）' }
          Add-Content $env:GITHUB_STEP_SUMMARY "${{ matrix.label }}: $status"

  chrome:
    name: Chrome build
    runs-on: ubuntu-latest
    # 手动触发按 platform 过滤；push tag 无 inputs，总是跑
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.platform == 'all' ||
      github.event.inputs.platform == 'chrome'

    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # 版本读根 package.json 的 packageManager 字段（pnpm@9.15.0）

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Chrome extension
        run: pnpm --filter @fund01/chrome build

      - name: Zip Chrome extension
        # FUND01_ZIP_SUFFIX=-ci：归档名带来源标识（Fund01_<ver>_chrome-ci.zip），
        # 与本机打包（无后缀）区分（三端 CI 统一 -ci 约定）。
        env:
          FUND01_ZIP_SUFFIX: -ci
        run: pnpm --filter @fund01/chrome zip

      - name: Generate checksums
        working-directory: release-chrome
        run: |
          ls -la
          shasum -a 256 Fund01_*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload zip
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fund01-chrome
          path: |
            release-chrome/*.zip
            release-chrome/SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 30