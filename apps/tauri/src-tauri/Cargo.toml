[package]
name = "fund01-tauri"
version = "1.5.0"
description = "fund01 基金盯盘桌面版（macOS menubar）"
authors = ["lingyired"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "fund01_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-store = "2"
# 开机自启动：设置界面「App 设置」card 控制（macOS LaunchAgent 登录项，与 Clash Verge Rev 同款）
tauri-plugin-autostart = "2"
# 原生保存/打开对话框（导出配置「选择位置保存」；与 Clash Verge Rev 同款 tauri-plugin-dialog save()）。
# macOS 上即系统 NSSavePanel：可任意导航选目录 + 改文件名，替代 WebView a.download 固定落下载目录。
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "cookies"] }
chrono = "0.4"
regex = "1"
futures = "0.3"

# 平台状态栏插件（用户自研、API 同构、互斥编译）：
# - macOS multiline-menubar：固定 GitHub v1.7.0（v1.5.0 新增 per-line 水平对齐；v1.6.0 新增
#   NSStatusItemBehaviorRemovalAllowed —— 用户可 ⌘-拖出单个实例而不影响其他，并 emit remove 事件；
#   v1.6.1 修复右键菜单退出挂起：native 补发 rightMouseUp + quit 延迟 ~200ms 异步 app.exit；
#   v1.7.0 系统色跟随：ColorStyle::Default 绘制时解析 NSColor.labelColor、KVO effectiveAppearance
#   深浅色切换自动重绘（fund01 未自定义颜色即下发 Default，两端语义对齐 taskband）；
#   MenuItemDescriptor 新增 enabled（disabled 弃用但兼容）；popup-open payload 扩展颜色/对齐快照）
# - Windows multiline-taskband：见下方 target 段
# 与本地工作区解耦
# macOS: 拦截 Dock 右键「退出」/ Cmd+Q（NSApp terminate:），给 AppDelegate 动态挂 applicationShouldTerminate:
# 实现「退出 = 只关设置窗口，menubar 保持常驻」。版本与 tauri 依赖链 objc2 0.6.x 一致。
# block2: popup 点击外部自动隐藏 —— 全局 NSEvent mouseDown monitor（见 window.rs install_global_click_monitor）。
# macOS 上 floating level / Accessory app 的 windowDidResignKey 经常不触发，Focused(false) 兜不住，
# 全局 monitor 按点击坐标判断（社区验证最可靠）。block2 与 objc2-app-kit 的 "block2" feature 配套。
[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-multiline-menubar = { git = "https://github.com/lingyired/tauri-plugin-multiline-menubar", tag = "v1.7.0" }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["block2"] }
objc2-foundation = "0.3"
block2 = "0.6"

# Windows 任务栏多行分组插件：仅 windows 目标编译，macOS 构建完全不带。
# GitHub tag v1.0.0（2026-08-30 首个 stable tag）：相对 9597d41 仅 Windows 渲染修复
#（TrafficMonitor 风格整格背景带 + DT_VCENTER 垂直居中，字形顶部不再被裁切）与 demo 改动，
# Rust/JS API 无变化（见 docs/tauri-plugin-multiline-taskband-适配说明.md）。
[target.'cfg(target_os = "windows")'.dependencies]
tauri-plugin-multiline-taskband = { git = "https://github.com/lingyired/tauri-plugin-multiline-taskband", tag = "v1.0.0" }

[profile.release]
strip = true
# fat LTO 与 tauri-plugin-multiline-menubar 的 native ObjC++ block 符号不兼容（arm64 链接失败），
# 用 thin LTO 兼顾体积与兼容
lto = "thin"
codegen-units = 1
