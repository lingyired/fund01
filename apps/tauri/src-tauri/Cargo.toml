[package]
name = "fund01-tauri"
version = "1.0.43"
description = "fund01 基金盯盘桌面版（macOS menubar）"
authors = ["lingyired"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "fund01_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-store = "2"
# 开机自启动：设置界面「App 设置」card 控制（macOS LaunchAgent 登录项，与 Clash Verge Rev 同款）
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "cookies"] }
chrono = "0.4"
regex = "1"
futures = "0.3"
# 多行 menubar 插件（用户自研）：固定 GitHub v1.6.0（v1.5.0 新增 per-line 水平对齐；v1.6.0 新增
# NSStatusItemBehaviorRemovalAllowed —— 用户可 ⌘-拖出单个实例而不影响其他，并 emit remove 事件），
# 与本地工作区解耦
tauri-plugin-multiline-menubar = { git = "https://github.com/lingyired/tauri-plugin-multiline-menubar", tag = "v1.6.0" }

# macOS: 拦截 Dock 右键「退出」/ Cmd+Q（NSApp terminate:），给 AppDelegate 动态挂 applicationShouldTerminate:
# 实现「退出 = 只关设置窗口，menubar 保持常驻」。版本与 tauri 依赖链 objc2 0.6.x 一致。
# block2: popup 点击外部自动隐藏 —— 全局 NSEvent mouseDown monitor（见 window.rs install_global_click_monitor）。
# macOS 上 floating level / Accessory app 的 windowDidResignKey 经常不触发，Focused(false) 兜不住，
# 全局 monitor 按点击坐标判断（社区验证最可靠）。block2 与 objc2-app-kit 的 "block2" feature 配套。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["block2"] }
objc2-foundation = "0.3"
block2 = "0.6"

[profile.release]
strip = true
# fat LTO 与 tauri-plugin-multiline-menubar 的 native ObjC++ block 符号不兼容（arm64 链接失败），
# 用 thin LTO 兼顾体积与兼容
lto = "thin"
codegen-units = 1
