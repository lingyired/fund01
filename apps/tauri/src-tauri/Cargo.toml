[package]
name = "fund01-tauri"
version = "1.0.0"
description = "fund01 基金盯盘桌面版（macOS menubar）"
authors = ["lingyired"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "fund01_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "cookies"] }
chrono = "0.4"
regex = "1"
encoding_rs = "0.8"
futures = "0.3"
# 多行 menubar 插件（用户自研）：固定 GitHub 最新版 v1.2.0，与本地工作区解耦
tauri-plugin-multiline-menubar = { git = "https://github.com/lingyired/tauri-plugin-multiline-menubar", tag = "v1.2.0" }

[profile.release]
strip = true
# fat LTO 与 tauri-plugin-multiline-menubar 的 native ObjC++ block 符号不兼容（arm64 链接失败），
# 用 thin LTO 兼顾体积与兼容
lto = "thin"
codegen-units = 1
