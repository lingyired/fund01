<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fund01 · 基金盯盘</title>
    <!-- Google Fonts 用 <link> 并行加载，避免 CSS @import 阻塞渲染导致 popup 白屏 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" />
    <style>
      /* Chrome 扩展 popup 默认无尺寸，需显式设定固定宽高。
         packages/ui 的 index.css 用 100vh 是为 dashboard 标签页设计，
         在 popup 中 100vh = popup 视口高度但视口本身未定义，不能依赖。
         高度优先用 900px；popup.js 启动时会读取 screen.availHeight
         做兜底（取 min(900, screen.availHeight)），保证不超过屏幕分辨率高度。
         MV3 CSP 禁止内联 script，所以兜底逻辑必须在打包的 popup.js 中执行。 */
      html, body {
        width: 666px !important;
        min-height: 900px !important;
        max-width: 666px !important;
      }
      #root {
        width: 666px !important;
        min-height: 900px !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
