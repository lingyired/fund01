<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>wzk-fund · 基金盯盘</title>
    <style>
      /* Chrome 扩展 popup 默认无尺寸，需显式设定固定宽高。
         packages/ui 的 index.css 用 100vh 是为 dashboard 标签页设计，
         在 popup 中 100vh = popup 视口高度会导致尺寸为 0，这里强制覆盖。 */
      html, body {
        width: 666px !important;
        min-height: 600px !important;
        max-width: 666px !important;
      }
      #root {
        width: 666px !important;
        min-height: 600px !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
