<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fund01 · 基金盯盘</title>
    <!-- Google Fonts 用 <link> 并行加载，避免 CSS @import 阻塞渲染导致 popup 白屏 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" />
    <style>
      /* Chrome 扩展 popup 窗口高度被浏览器限制（多数环境约 600px）。
         这里给一个保守的默认高度，避免加载瞬间出现整窗滚动条；
         真实高度由 popup.js 运行时按 popup 窗口实际高度 (window.innerHeight) 精确覆盖。 */
      html, body {
        width: 680px !important;
        height: 600px !important;
        min-height: 0 !important;
        max-width: 680px !important;
        max-height: 600px !important;
        overflow: hidden !important;
      }
      #root {
        width: 680px !important;
        height: 600px !important;
        min-height: 0 !important;
        max-height: 600px !important;
        overflow: hidden !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
