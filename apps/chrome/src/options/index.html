<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fund01 · 设置</title>
    <!-- Google Fonts 用 <link> 并行加载，避免 CSS @import 阻塞渲染导致白屏 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" />
    <style>
      /* 设置页是完整浏览器标签页，按自然文档流排布、由浏览器原生滚动。
         不锁死高度、不隐藏溢出（那套是 popup 用的，放这里会导致半屏空白）。 */
      html, body, #root {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
